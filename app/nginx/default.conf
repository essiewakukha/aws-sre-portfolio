server {
    listen 80;

    # ALB target group health check
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}