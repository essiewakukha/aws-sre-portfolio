- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable mod_headers
  community.general.apache2_module:
    name: headers
    state: present
  notify: Reload apache

- name: Render site from Jinja2 templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: index.html.j2, dest: /var/www/html/index.html }
    - { src: health.j2, dest: /var/www/html/health }
    - { src: 000-default.conf.j2, dest: /etc/apache2/sites-available/000-default.conf }
  notify: Reload apache

- name: Ensure Apache is running
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true